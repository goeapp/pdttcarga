<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>P-Chat — PdTT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ea580c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --header: #ea580c;
    --header-sub: #fdba8c;
    --wallpaper: #ece5dd;
    --out-bubble: #ffedd5;
    --in-bubble: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --orange: #f97316;
    --orange-dark: #ea580c;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --error-ink: #b91c1c;
    --check-blue: #34b7f1;
    --inactive-gray: #cbd5e1;
  }
  html, body{ height:100%; margin:0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:#0b141a; color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; justify-content:center;
    height:100dvh; overflow:hidden;
  }
  .phone{
    width:100%; max-width:420px; height:100dvh;
    background:var(--wallpaper);
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }

  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--wallpaper); }
  .screen.hidden{ display:none; }

  /* ---------- Header común ---------- */
  .chat-header{
    background:var(--header); color:#fff;
    padding:14px 14px; display:flex; align-items:center; gap:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    flex:none;
  }
  .chat-header .back{ font-size:20px; opacity:.9; cursor:pointer; padding:2px 4px; }
  .chat-header .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--header-sub); display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--header); font-size:14px; flex:none;
  }
  .chat-header .avatar.inactive{ background:#e5e7eb; color:#9ca3af; }
  .chat-header .info{ flex:1; min-width:0; }
  .chat-header .name{ font-size:15px; font-weight:700; }
  .chat-header .status{ font-size:12px; opacity:.85; margin-top:1px; }
  .chat-header .version-pill{
    font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    background:rgba(255,255,255,.2); padding:3px 8px; border-radius:999px;
  }
  .chat-header .dots{
    font-size:20px; cursor:pointer; padding:4px 8px; line-height:1;
  }

  /* ---------- Home: lista de asistentes ---------- */
  .home-title{
    font-size:22px; font-weight:800; color:#fff; letter-spacing:-.02em;
  }
  .home-list{ flex:1; overflow-y:auto; }
  .home-item{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px; cursor:pointer;
    border-bottom:1px solid rgba(0,0,0,.05);
  }
  .home-item:active{ background:rgba(0,0,0,.04); }
  .home-item .avatar{
    width:52px; height:52px; border-radius:50%; flex:none;
    background:var(--orange); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:17px;
  }
  .home-item .avatar.inactive{ background:var(--inactive-gray); color:#fff; }
  .home-item .body{ flex:1; min-width:0; }
  .home-item .name{ font-size:15.5px; font-weight:700; color:var(--ink); }
  .home-item .sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .home-item .sub.activo{ color:#16a34a; font-weight:600; }
  .home-item .sub.inactivo{ color:#94a3b8; }

  /* ---------- Menú de 3 puntitos (tarjeta) ---------- */
  .menu-overlay{
    position:absolute; inset:0; background:rgba(0,0,0,.35);
    display:flex; justify-content:flex-end; align-items:flex-start; z-index:20;
  }
  .menu-overlay.hidden{ display:none; }
  .menu-card{
    background:#fff; width:78%; max-width:300px;
    margin:56px 10px 0 0; border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    padding:16px; font-size:14px;
  }
  .menu-card .u-nombre{ font-weight:800; font-size:16px; color:var(--ink); }
  .menu-card .u-dato{ color:var(--ink-soft); margin-top:6px; line-height:1.4; }
  .menu-card hr{ border:none; border-top:1px solid #eee; margin:12px 0; }
  .menu-card .m-version{ color:var(--ink-soft); font-size:12.5px; margin-bottom:10px; }
  .menu-btn{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 4px; font-family:inherit; font-size:14px; font-weight:600;
    color:var(--ink); cursor:pointer; border-radius:6px;
  }
  .menu-btn:active{ background:#f3f4f6; }
  .menu-btn.danger{ color:var(--error-ink); }
  .menu-btn.hidden{ display:none; }

  /* ---------- Mensajes (chat) ---------- */
  .messages{
    flex:1; overflow-y:auto; padding:14px 10px 10px;
    display:flex; flex-direction:column; gap:2px;
  }
  .msg-row{ display:flex; margin:4px 0; }
  .msg-row.bot{ justify-content:flex-start; }
  .msg-row.user{ justify-content:flex-end; }

  .bubble{
    max-width:78%; padding:8px 10px 6px; border-radius:9px;
    font-size:14.5px; line-height:1.35; position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
  }
  .msg-row.bot .bubble{ background:var(--in-bubble); border-top-left-radius:2px; }
  .msg-row.user .bubble{ background:var(--out-bubble); border-top-right-radius:2px; }
  .bubble .txt{ white-space:pre-line; }
  .bubble .meta{
    display:flex; justify-content:flex-end; align-items:center; gap:3px;
    margin-top:3px; font-size:10.5px; color:var(--ink-soft); opacity:.75;
  }
  .bubble.error{ background:var(--error-bg); border:1px solid var(--error-border); color:var(--error-ink); }
  .bubble.error .meta{ color:var(--error-ink); opacity:.6; }
  .check{ color:var(--check-blue); font-weight:700; }

  .qr-wrap{ display:flex; flex-direction:column; gap:6px; margin:6px 0 10px 2px; max-width:82%; }
  .qr-btn{
    background:#fff; border:1.5px solid var(--orange); color:var(--orange-dark);
    font-family:inherit; font-size:14px; font-weight:700;
    padding:10px 14px; border-radius:20px; text-align:left; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .qr-btn:active{ background:var(--orange); color:#fff; }
  .qr-btn .sub{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:1px; }
  .qr-btn:active .sub{ color:#ffedd5; }

  .resumen-box{
    background:#fff7ed; border:1.5px solid #fdba74; border-radius:10px;
    padding:10px 12px; margin-top:4px; font-size:13.5px;
  }
  .resumen-box .row{ display:flex; justify-content:space-between; gap:14px; padding:2px 0; }
  .resumen-box .row b{ color:var(--ink); text-align:right; }
  .resumen-box .row span:first-child{ color:var(--ink-soft); font-weight:600; flex:0 0 auto; }
  .resumen-actions{ display:flex; gap:8px; margin-top:8px; }
  .resumen-actions button{
    flex:1; border:none; border-radius:8px; padding:10px 0;
    font-family:inherit; font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .btn-enviar{ background:var(--orange); color:#fff; }
  .btn-enviar:active{ background:var(--orange-dark); }
  .btn-nuevo{ background:#e2e8f0; color:var(--ink-soft); }
  .btn-nuevo:active{ background:#cbd5e1; }

  .typing{ display:flex; gap:3px; padding:10px 12px; }
  .typing span{
    width:6px; height:6px; border-radius:50%; background:#a3a3a3;
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  .input-bar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; background:#f0f0f0;
    border-top:1px solid #ddd; flex:none;
  }
  .input-pill{
    flex:1; background:#fff; border-radius:22px; padding:9px 14px;
    display:flex; align-items:center;
  }
  .input-pill input{
    border:none; outline:none; width:100%; font-family:inherit;
    font-size:15px; background:transparent; color:var(--ink);
  }
  .input-pill input.pin-field{ letter-spacing: 4px; font-weight:700; }
  .input-pill input::placeholder{ color:#9ca3af; letter-spacing:normal; font-weight:400; }
  .send-btn{
    width:42px; height:42px; border-radius:50%; background:var(--orange);
    border:none; color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
  }
  .send-btn:active{ background:var(--orange-dark); }
  .send-btn[disabled]{ background:#cbd5e1; cursor:not-allowed; }
  .input-bar.hidden{ visibility:hidden; pointer-events:none; }

  /* ---------- Toast ---------- */
  .toast{
    position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
    background:#1f2937; color:#fff; padding:10px 16px; border-radius:8px;
    font-size:13px; max-width:88%; text-align:center; z-index:30;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="phone">

  <!-- ============================= LOGIN ============================= -->
  <div class="screen" id="screenLogin">
    <div class="chat-header">
      <div class="home-title" style="flex:1;">P-Chat</div>
    </div>
    <div class="messages" id="messagesLogin"></div>
    <div class="input-bar hidden" id="inputBarLogin">
      <div class="input-pill">
        <input type="text" id="numInputLogin" inputmode="numeric" pattern="[0-9]*" placeholder="Escribí un número…">
      </div>
      <button class="send-btn" id="sendBtnLogin">➤</button>
    </div>
  </div>

  <!-- ============================= HOME ============================= -->
  <div class="screen hidden" id="screenHome">
    <div class="chat-header">
      <div class="home-title" style="flex:1;">P-Chat</div>
      <div class="dots" id="btnMenu">⋮</div>
    </div>
    <div class="home-list" id="homeList">
      <div class="home-item" id="itemCA">
        <div class="avatar">CA</div>
        <div class="body">
          <div class="name">Asistente carga avance</div>
          <div class="sub activo">Activo</div>
        </div>
      </div>
      <div class="home-item" id="itemRE">
        <div class="avatar inactive">RE</div>
        <div class="body">
          <div class="name">Asistente reportes</div>
          <div class="sub inactivo">Inactivo</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================= CHAT ============================= -->
  <div class="screen hidden" id="screenChat">
    <div class="chat-header">
      <div class="back" id="btnVolver">‹</div>
      <div class="avatar">CA</div>
      <div class="info">
        <div class="name">P-Chat · PdTT</div>
        <div class="status">carga de avance</div>
      </div>
      <div class="version-pill">v1.3</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-bar hidden" id="inputBar">
      <div class="input-pill">
        <input type="text" id="numInput" inputmode="numeric" pattern="[0-9]*" placeholder="Escribí un número…">
      </div>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- ===================== Tarjeta de menú (3 puntitos) ===================== -->
  <div class="menu-overlay hidden" id="menuOverlay">
    <div class="menu-card">
      <div id="menuDatosUsuario">
        <div class="u-nombre">Sin identificar</div>
        <div class="u-dato">Todavía no iniciaste sesión en ningún asistente.</div>
      </div>
      <hr>
      <div class="m-version">Versión v1.3</div>
      <button class="menu-btn" id="btnInstalar">Instalar app</button>
      <button class="menu-btn" id="btnActualizar">Actualizar</button>
      <button class="menu-btn danger hidden" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// =============================================================================
// P-Chat v1.3 — Config
// =============================================================================
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycby7HEXqngCqGOGo7HinuWP8zAE2NBImFHaYvhrWzYXmfg0WOmzMau4HvFyHq5Z30ZhI/exec',
  SESSION_KEY: 'pchat_session_v1',
  SESSION_DIAS: 7
};

const screenLogin = document.getElementById('screenLogin');
const screenHome = document.getElementById('screenHome');
const screenChat = document.getElementById('screenChat');
const menuOverlay = document.getElementById('menuOverlay');
const toastEl = document.getElementById('toast');

// =============================================================================
// Toast
// =============================================================================
let toastTimer = null;
function mostrarToast(msg, ms=2600){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}

// =============================================================================
// Llamadas al backend
// =============================================================================

async function apiCall(action, params){
  params = params || {};
  try{
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, params))
    });
    return await res.json();
  }catch(err){
    console.error('apiCall error', action, err);
    return { ok:false, error: String(err) };
  }
}

// =============================================================================
// Sesión (localStorage)
// =============================================================================

function getSession(){
  try{
    const raw = localStorage.getItem(CONFIG.SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    const venceMs = CONFIG.SESSION_DIAS * 24 * 60 * 60 * 1000;
    if(Date.now() - s.ts > venceMs){
      localStorage.removeItem(CONFIG.SESSION_KEY);
      return null;
    }
    return s;
  }catch(e){
    return null;
  }
}

function saveSession(datos){
  localStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(Object.assign({ ts: Date.now() }, datos)));
}

// =============================================================================
// "Superficie" de chat reutilizable (Login y Chat de tareas usan cada uno la suya)
// =============================================================================

function now(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function makeSurface(elMessages, elInputBar, elNumInput, elSendBtn){

  function scrollBottom(){
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        elMessages.scrollTop = elMessages.scrollHeight;
      });
    });
  }
  // El teclado virtual tarda en terminar su animación; visualViewport.resize
  // se dispara cuando el layout realmente cambió (no al arrancar la animación).
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', scrollBottom);
  }

  function addBotBubble(text, {error=false}={}){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const bub = document.createElement('div');
    bub.className = 'bubble' + (error ? ' error' : '');
    bub.innerHTML = `<div class="txt"></div><div class="meta">${now()}</div>`;
    bub.querySelector('.txt').textContent = text;
    row.appendChild(bub);
    elMessages.appendChild(row);
    scrollBottom();
    return bub;
  }

  function addUserBubble(text){
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.innerHTML = `<div class="txt"></div><div class="meta">${now()} <span class="check">✓✓</span></div>`;
    bub.querySelector('.txt').textContent = text;
    row.appendChild(bub);
    elMessages.appendChild(row);
    scrollBottom();
  }

  function showTyping(cb, delay=450){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    elMessages.appendChild(row);
    scrollBottom();
    setTimeout(() => {
      row.remove();
      cb();
    }, delay);
  }

  function addQuickReplies(options){
    const wrap = document.createElement('div');
    wrap.className = 'qr-wrap';
    options.forEach(opt => {
      const btn = document.createElement('div');
      btn.className = 'qr-btn';
      btn.innerHTML = opt.sub
        ? `${opt.label}<span class="sub">${opt.sub}</span>`
        : opt.label;
      btn.addEventListener('click', () => opt.onClick());
      wrap.appendChild(btn);
    });
    elMessages.appendChild(wrap);
    scrollBottom();
  }

  function setInputMode(active, placeholder='', {pin=false}={}){
    if(active){
      elInputBar.classList.remove('hidden');
      elNumInput.value = '';
      elNumInput.placeholder = placeholder;
      elNumInput.type = pin ? 'password' : 'text';
      elNumInput.classList.toggle('pin-field', pin);
      elSendBtn.removeAttribute('disabled');
      setTimeout(() => elNumInput.focus(), 50);
    } else {
      elInputBar.classList.add('hidden');
    }
  }

  return {
    addBotBubble, addUserBubble, showTyping, addQuickReplies,
    setInputMode, scrollBottom,
    elMessages, elInputBar, elNumInput, elSendBtn
  };
}

const loginSurface = makeSurface(
  document.getElementById('messagesLogin'),
  document.getElementById('inputBarLogin'),
  document.getElementById('numInputLogin'),
  document.getElementById('sendBtnLogin')
);

const chatSurface = makeSurface(
  document.getElementById('messages'),
  document.getElementById('inputBar'),
  document.getElementById('numInput'),
  document.getElementById('sendBtn')
);

// =============================================================================
// Navegación entre pantallas
// =============================================================================

function mostrarLogin(){
  menuOverlay.classList.add('hidden');
  screenHome.classList.add('hidden');
  screenChat.classList.add('hidden');
  screenLogin.classList.remove('hidden');
}

function mostrarHome(){
  menuOverlay.classList.add('hidden');
  screenLogin.classList.add('hidden');
  screenChat.classList.add('hidden');
  screenHome.classList.remove('hidden');
}

function abrirChatCA(){
  const session = getSession();
  if(!session){
    // defensivo: no debería pasar si Home solo se ve con sesión activa
    mostrarLogin();
    runLoginFlow();
    return;
  }
  chatCtx = Object.assign({}, session);
  screenHome.classList.add('hidden');
  screenChat.classList.remove('hidden');
  entrarChatFlow();
}

document.getElementById('itemCA').addEventListener('click', abrirChatCA);
document.getElementById('itemRE').addEventListener('click', () => {
  mostrarToast('Asistente de reportes — Próximamente 🚧');
});
document.getElementById('btnVolver').addEventListener('click', mostrarHome);

// =============================================================================
// Menú de 3 puntitos
// =============================================================================

document.getElementById('btnMenu').addEventListener('click', () => {
  renderMenuUsuario();
  menuOverlay.classList.remove('hidden');
});
menuOverlay.addEventListener('click', (e) => {
  if(e.target === menuOverlay) menuOverlay.classList.add('hidden');
});

function renderMenuUsuario(){
  const session = getSession();
  const cont = document.getElementById('menuDatosUsuario');
  const btnCerrar = document.getElementById('btnCerrarSesion');
  if(session){
    cont.innerHTML = `
      <div class="u-nombre">${session.nombre}</div>
      <div class="u-dato">${session.email}</div>
      <div class="u-dato">${session.puesto || ''}${session.puesto ? ' · ' : ''}${session.obra || ''}</div>
    `;
    btnCerrar.classList.remove('hidden');
  }else{
    cont.innerHTML = `
      <div class="u-nombre">Sin identificar</div>
      <div class="u-dato">Todavía no iniciaste sesión.</div>
    `;
    btnCerrar.classList.add('hidden');
  }
}

document.getElementById('btnCerrarSesion').addEventListener('click', () => {
  localStorage.removeItem(CONFIG.SESSION_KEY);
  menuOverlay.classList.add('hidden');
  // Reset total: nueva identificación, nuevo saludo la próxima vez que se entre al chat.
  loginSurface.elMessages.innerHTML = '';
  chatSurface.elMessages.innerHTML = '';
  yaSaludoEnChat = false;
  mostrarToast('Sesión cerrada');
  mostrarLogin();
  runLoginFlow();
});

document.getElementById('btnActualizar').addEventListener('click', () => {
  menuOverlay.classList.add('hidden');
  location.reload();
});

// =============================================================================
// Login — identificación (nombre + PIN), pantalla propia, antes de Home
// =============================================================================

let loginState = null;
let loginCtx = {};
let pinNuevoTemp = null;

async function runLoginFlow(){
  loginCtx = {};
  pinNuevoTemp = null;
  loginState = null;
  loginSurface.setInputMode(false);

  const saludoRes = await apiCall('obtenerSaludo');
  const saludo = (saludoRes && saludoRes.ok) ? saludoRes.saludo : 'Hola.';

  loginSurface.showTyping(async () => {
    loginSurface.addBotBubble(`${saludo} ¿Quién sos?`);
    const res = await apiCall('listarUsuariosActivos');
    if(!res.ok){
      loginSurface.addBotBubble('No pude conectar con el Sheet. Reintentá en un momento.', {error:true});
      return;
    }
    if(!res.usuarios.length){
      loginSurface.addBotBubble('No encontré usuarios activos configurados.', {error:true});
      return;
    }
    loginSurface.addQuickReplies(res.usuarios.map(u => ({
      label: u.nombre,
      onClick: () => selectUsuarioLogin(u)
    })));
  }, 300);
}

function selectUsuarioLogin(u){
  loginSurface.addUserBubble(u.nombre);
  loginCtx.email = u.email;
  loginState = 'ask_pin';
  loginSurface.showTyping(() => {
    loginSurface.addBotBubble(`Ingresá tu PIN, ${u.nombre.split(' ')[0]}`);
    loginSurface.setInputMode(true, 'PIN', {pin:true});
  });
}

async function handlePinLogin(raw){
  loginSurface.addUserBubble(raw ? '•'.repeat(raw.length) : '(vacío)');
  loginSurface.setInputMode(false);

  if(raw.trim() === ''){
    loginSurface.showTyping(() => {
      loginSurface.addBotBubble('Ingresá tu PIN para continuar.', {error:true});
      loginSurface.setInputMode(true, 'PIN', {pin:true});
    }, 300);
    return;
  }

  loginSurface.showTyping(async () => {
    const res = await apiCall('validarPIN', { email: loginCtx.email, pin: raw });

    if(!res || res.ok === undefined){
      loginSurface.addBotBubble('Hubo un problema de conexión. Reintentá el PIN.', {error:true});
      loginSurface.setInputMode(true, 'PIN', {pin:true});
      return;
    }

    if(res.ok){
      loginCtx.nombre = res.nombre;
      loginCtx.obra = res.obra;
      loginCtx.cuadrilla = res.cuadrilla;
      loginCtx.puesto = res.puesto;

      if(res.requiereCambio){
        loginState = 'ask_pin_nuevo';
        loginSurface.addBotBubble('Es tu primer ingreso. Creá tu PIN propio.');
        loginSurface.setInputMode(true, 'Nuevo PIN', {pin:true});
      }else{
        completarLogin();
      }
      return;
    }

    if(res.motivo === 'inactivo'){
      loginSurface.addBotBubble('Tu usuario está dado de baja. Consultá con tu supervisor.', {error:true});
      setTimeout(runLoginFlow, 1800);
    }else if(res.motivo === 'bloqueado'){
      loginSurface.addBotBubble('Tu acceso está bloqueado por intentos fallidos. Consultá con tu supervisor.', {error:true});
      setTimeout(runLoginFlow, 1800);
    }else if(res.motivo === 'bloqueado_ahora'){
      loginSurface.addBotBubble('PIN incorrecto. Se alcanzó el límite de intentos — tu acceso quedó bloqueado. Consultá con tu supervisor.', {error:true});
      setTimeout(runLoginFlow, 2200);
    }else if(res.motivo === 'no_encontrado'){
      loginSurface.addBotBubble('No encontré tu usuario. Reintentá desde el principio.', {error:true});
      setTimeout(runLoginFlow, 1800);
    }else{
      const restantesTxt = (typeof res.restantes === 'number')
        ? `Te quedan ${res.restantes} intento(s).`
        : 'Reintentá.';
      loginSurface.addBotBubble(`PIN incorrecto. ${restantesTxt}`, {error:true});
      loginSurface.setInputMode(true, 'PIN', {pin:true});
    }
  }, 350);
}

async function handlePinNuevoLogin(raw){
  loginSurface.addUserBubble(raw ? '•'.repeat(raw.length) : '(vacío)');
  loginSurface.setInputMode(false);

  if(raw.trim() === '' || raw.trim().length < 4){
    loginSurface.showTyping(() => {
      loginSurface.addBotBubble('El PIN debe tener al menos 4 dígitos.', {error:true});
      loginSurface.setInputMode(true, 'Nuevo PIN', {pin:true});
    }, 300);
    return;
  }

  pinNuevoTemp = raw.trim();
  loginState = 'ask_pin_nuevo_confirm';
  loginSurface.showTyping(() => {
    loginSurface.addBotBubble('Repetí el mismo PIN para confirmar.');
    loginSurface.setInputMode(true, 'Confirmá tu PIN', {pin:true});
  }, 300);
}

async function handlePinNuevoConfirmLogin(raw){
  loginSurface.addUserBubble(raw ? '•'.repeat(raw.length) : '(vacío)');
  loginSurface.setInputMode(false);

  if(raw.trim() !== pinNuevoTemp){
    pinNuevoTemp = null;
    loginState = 'ask_pin_nuevo';
    loginSurface.showTyping(() => {
      loginSurface.addBotBubble('No coincide con el anterior. Empecemos de nuevo con el PIN.', {error:true});
      loginSurface.setInputMode(true, 'Nuevo PIN', {pin:true});
    }, 350);
    return;
  }

  loginSurface.showTyping(async () => {
    const res = await apiCall('crearPINPropio', { email: loginCtx.email, pinNuevo: pinNuevoTemp });
    pinNuevoTemp = null;

    if(!res.ok){
      loginSurface.addBotBubble('No pude guardar tu PIN. Reintentá desde el principio.', {error:true});
      setTimeout(runLoginFlow, 1800);
      return;
    }

    loginSurface.addBotBubble('Listo, PIN creado ✅');
    completarLogin();
  }, 350);
}

function completarLogin(){
  saveSession({
    email: loginCtx.email,
    nombre: loginCtx.nombre,
    obra: loginCtx.obra,
    cuadrilla: loginCtx.cuadrilla,
    puesto: loginCtx.puesto
  });
  setTimeout(mostrarHome, 600);
}

document.getElementById('sendBtnLogin').addEventListener('click', () => {
  const val = document.getElementById('numInputLogin').value;
  document.getElementById('numInputLogin').value = '';
  if(loginState === 'ask_pin') handlePinLogin(val);
  else if(loginState === 'ask_pin_nuevo') handlePinNuevoLogin(val);
  else if(loginState === 'ask_pin_nuevo_confirm') handlePinNuevoConfirmLogin(val);
});
document.getElementById('numInputLogin').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('sendBtnLogin').click();
});

// =============================================================================
// Chat de carga de avance — ya identificado (sesión existente)
// =============================================================================

let chatState = null;
let chatCtx = {};
let yaSaludoEnChat = false; // el saludo con nombre aparece una sola vez por apertura de la app

async function entrarChatFlow(){
  chatSurface.setInputMode(false);

  if(!yaSaludoEnChat){
    const saludoRes = await apiCall('obtenerSaludo');
    const saludo = (saludoRes && saludoRes.ok) ? saludoRes.saludo : 'Hola.';
    yaSaludoEnChat = true;
    chatSurface.showTyping(() => {
      chatSurface.addBotBubble(`${saludo} ${chatCtx.nombre.split(' ')[0]} 👋`);
      loadTareasYPreguntar();
    }, 300);
  }else{
    loadTareasYPreguntar();
  }
}

function loadTareasYPreguntar(){
  chatSurface.showTyping(async () => {
    const res = await apiCall('obtenerTareas', { email: chatCtx.email });

    if(!res.ok){
      chatSurface.addBotBubble('No pude cargar tus tareas. Reintentá en un momento.', {error:true});
      return;
    }
    if(!res.tareas.length){
      chatSurface.addBotBubble('No encontré tareas asignadas para vos en el Sheet.', {error:true});
      return;
    }

    chatSurface.addBotBubble('Dale. ¿Qué actividad cargás?');
    chatSurface.addQuickReplies(res.tareas.map(it => ({
      label: it.nombre,
      sub: `IWP ${it.iwp} · ${it.tipo}`,
      onClick: () => selectIWP(it)
    })));
  }, 300);
}

function selectIWP(item){
  chatSurface.addUserBubble(`IWP ${item.iwp} — ${item.nombre}`);
  chatCtx.iwp = item;
  chatState = 'ask_cantidad';
  chatSurface.showTyping(() => {
    chatSurface.addBotBubble('¿Cantidad de trabajo realizado?');
    chatSurface.setInputMode(true, 'Ej: 40');
  });
}

function handleCantidad(raw){
  const n = Number(raw);
  if(raw.trim() === '' || isNaN(n) || n <= 0){
    chatSurface.addUserBubble(raw || '(vacío)');
    chatSurface.setInputMode(false);
    chatSurface.showTyping(() => {
      chatSurface.addBotBubble('Ese valor no es válido. Ingresá un número mayor a cero.', {error:true});
      chatSurface.setInputMode(true, 'Ej: 40');
    }, 350);
    return;
  }
  chatSurface.addUserBubble(raw);
  chatCtx.cantidad = n;
  chatState = 'ask_personas';
  chatSurface.setInputMode(false);
  chatSurface.showTyping(() => {
    chatSurface.addBotBubble('¿Cantidad de personas en la cuadrilla?');
    chatSurface.setInputMode(true, 'Ej: 3');
  });
}

function handlePersonas(raw){
  const n = Number(raw);
  if(raw.trim() === '' || isNaN(n) || n <= 0){
    chatSurface.addUserBubble(raw || '(vacío)');
    chatSurface.setInputMode(false);
    chatSurface.showTyping(() => {
      chatSurface.addBotBubble('Ese valor no es válido. Ingresá un número mayor a cero.', {error:true});
      chatSurface.setInputMode(true, 'Ej: 3');
    }, 350);
    return;
  }
  chatSurface.addUserBubble(raw);
  chatCtx.personas = n;
  const hh = n * 8;
  chatState = 'confirm';
  chatSurface.setInputMode(false);
  chatSurface.showTyping(() => showResumen(hh));
}

function showResumen(hh){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.style.maxWidth = '85%';
  bub.innerHTML = `
    <div class="txt">Este es el resumen:</div>
    <div class="resumen-box">
      <div class="row"><span>Capataz</span><b>${chatCtx.nombre}</b></div>
      <div class="row"><span>Obra</span><b>${chatCtx.obra}</b></div>
      <div class="row"><span>IWP</span><b>${chatCtx.iwp.iwp} — ${chatCtx.iwp.nombre}</b></div>
      <div class="row"><span>Cantidad</span><b>${chatCtx.cantidad}</b></div>
      <div class="row"><span>Personas</span><b>${chatCtx.personas}</b></div>
      <div class="row"><span>HH (personas × 8)</span><b>${hh}</b></div>
      <div class="resumen-actions">
        <button class="btn-nuevo">Nuevo</button>
        <button class="btn-enviar">Enviar</button>
      </div>
    </div>
    <div class="meta">${now()}</div>
  `;
  bub.querySelector('.btn-enviar').addEventListener('click', () => confirmarEnvio(hh));
  bub.querySelector('.btn-nuevo').addEventListener('click', () => cancelarYNuevo());
  row.appendChild(bub);
  chatSurface.elMessages.appendChild(row);
  chatSurface.scrollBottom();
}

function confirmarEnvio(hh){
  chatSurface.addUserBubble('Enviar ✔');
  chatSurface.showTyping(() => {
    // Todavía no guarda en el Sheet real — eso es la próxima etapa (hoja Cargas_Avance).
    chatSurface.addBotBubble(`✅ Carga registrada localmente — IWP ${chatCtx.iwp.iwp}, Cant. ${chatCtx.cantidad}, HH ${hh}.\n(El guardado real en el Sheet queda para la próxima etapa.)`);
    setTimeout(() => { chatState = null; loadTareasYPreguntar(); }, 1200);
  }, 350);
}

function cancelarYNuevo(){
  chatSurface.addUserBubble('Nuevo');
  chatSurface.showTyping(() => {
    chatSurface.addBotBubble('Sin problema, empecemos de nuevo.');
    setTimeout(() => { chatState = null; loadTareasYPreguntar(); }, 700);
  }, 300);
}

document.getElementById('sendBtn').addEventListener('click', () => {
  const val = document.getElementById('numInput').value;
  document.getElementById('numInput').value = '';
  if(chatState === 'ask_cantidad') handleCantidad(val);
  else if(chatState === 'ask_personas') handlePersonas(val);
});
document.getElementById('numInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('sendBtn').click();
});

// =============================================================================
// PWA — Service Worker + Instalación
// =============================================================================

let deferredInstallPrompt = null;

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[PWA] SW registrado:', reg.scope))
      .catch(err => console.warn('[PWA] SW error:', err));
  });
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  mostrarToast('✅ App instalada correctamente');
});

document.getElementById('btnInstalar').addEventListener('click', () => {
  menuOverlay.classList.add('hidden');
  if(!deferredInstallPrompt){
    mostrarToast('En iOS: compartir → "Agregar a pantalla de inicio" 📱', 5000);
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(result => {
    if(result.outcome === 'accepted') mostrarToast('✅ ¡App instalada!');
    deferredInstallPrompt = null;
  });
});

// =============================================================================
// Arranque de la app
// =============================================================================

(function arrancar(){
  const session = getSession();
  if(session){
    mostrarHome();
  }else{
    mostrarLogin();
    runLoginFlow();
  }
})();
</script>
