<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P-Chat — PdTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --header: #ea580c;      /* naranja oscuro PdTT, reemplaza verde WhatsApp #075E54 */
    --header-sub: #fdba8c;
    --wallpaper: #ece5dd;   /* wallpaper clásico WhatsApp, se mantiene neutro */
    --out-bubble: #ffedd5;  /* naranja suave PdTT, reemplaza verde #DCF8C6 */
    --out-tail: #ffedd5;
    --in-bubble: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --orange: #f97316;
    --orange-dark: #ea580c;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --error-ink: #b91c1c;
    --check-blue: #34b7f1;
  }
  html, body{ height:100%; margin:0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:#0b141a; color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; justify-content:center;
    height:100vh; overflow:hidden;
  }
  .phone{
    width:100%; max-width:420px; height:100vh;
    background:var(--wallpaper);
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }

  /* Header estilo WhatsApp */
  .chat-header{
    background:var(--header); color:#fff;
    padding:14px 14px; display:flex; align-items:center; gap:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    position:sticky; top:0; z-index:5;
  }
  .chat-header .back{ font-size:20px; opacity:.9; }
  .chat-header .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--header-sub); display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--header); font-size:15px; flex:none;
  }
  .chat-header .info{ flex:1; min-width:0; }
  .chat-header .name{ font-size:15px; font-weight:700; }
  .chat-header .status{ font-size:12px; opacity:.85; margin-top:1px; }
  .chat-header .proto-pill{
    font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    background:rgba(255,255,255,.2); padding:3px 8px; border-radius:999px;
  }

  /* Área de mensajes */
  .messages{
    flex:1; overflow-y:auto; padding:14px 10px 10px;
    display:flex; flex-direction:column; gap:2px;
  }
  .msg-row{ display:flex; margin:4px 0; }
  .msg-row.bot{ justify-content:flex-start; }
  .msg-row.user{ justify-content:flex-end; }

  .bubble{
    max-width:78%; padding:8px 10px 6px; border-radius:9px;
    font-size:14.5px; line-height:1.35; position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
  }
  .msg-row.bot .bubble{ background:var(--in-bubble); border-top-left-radius:2px; }
  .msg-row.user .bubble{ background:var(--out-bubble); border-top-right-radius:2px; }
  .bubble .txt{ white-space:pre-line; }
  .bubble .meta{
    display:flex; justify-content:flex-end; align-items:center; gap:3px;
    margin-top:3px; font-size:10.5px; color:var(--ink-soft); opacity:.75;
  }
  .bubble.error{ background:var(--error-bg); border:1px solid var(--error-border); color:var(--error-ink); }
  .bubble.error .meta{ color:var(--error-ink); opacity:.6; }
  .check{ color:var(--check-blue); font-weight:700; }

  /* Botones quick-reply agrupados bajo el mensaje del bot */
  .qr-wrap{ display:flex; flex-direction:column; gap:6px; margin:6px 0 10px 2px; max-width:82%; }
  .qr-btn{
    background:#fff; border:1.5px solid var(--orange); color:var(--orange-dark);
    font-family:inherit; font-size:14px; font-weight:700;
    padding:10px 14px; border-radius:20px; text-align:left; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .qr-btn:active{ background:var(--orange); color:#fff; }
  .qr-btn .sub{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:1px; }
  .qr-btn:active .sub{ color:#ffedd5; }

  .resumen-box{
    background:#fff7ed; border:1.5px solid #fdba74; border-radius:10px;
    padding:10px 12px; margin-top:4px; font-size:13.5px;
  }
  .resumen-box .row{ display:flex; justify-content:space-between; gap:14px; padding:2px 0; }
  .resumen-box .row b{ color:var(--ink); text-align:right; }
  .resumen-box .row span:first-child{ color:var(--ink-soft); font-weight:600; flex:0 0 auto; }
  .resumen-actions{ display:flex; gap:8px; margin-top:8px; }
  .resumen-actions button{
    flex:1; border:none; border-radius:8px; padding:10px 0;
    font-family:inherit; font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .btn-enviar{ background:var(--orange); color:#fff; }
  .btn-enviar:active{ background:var(--orange-dark); }
  .btn-nuevo{ background:#e2e8f0; color:var(--ink-soft); }
  .btn-nuevo:active{ background:#cbd5e1; }

  .typing{ display:flex; gap:3px; padding:10px 12px; }
  .typing span{
    width:6px; height:6px; border-radius:50%; background:#a3a3a3;
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  /* Input bar estilo WhatsApp */
  .input-bar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; background:#f0f0f0;
    border-top:1px solid #ddd;
  }
  .input-pill{
    flex:1; background:#fff; border-radius:22px; padding:9px 14px;
    display:flex; align-items:center;
  }
  .input-pill input{
    border:none; outline:none; width:100%; font-family:inherit;
    font-size:15px; background:transparent; color:var(--ink);
  }
  .input-pill input::placeholder{ color:#9ca3af; }
  .send-btn{
    width:42px; height:42px; border-radius:50%; background:var(--orange);
    border:none; color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
  }
  .send-btn:active{ background:var(--orange-dark); }
  .send-btn[disabled]{ background:#cbd5e1; cursor:not-allowed; }
  .input-bar.hidden{ visibility:hidden; pointer-events:none; }
</style>
</head>
<body>
<div class="phone">

  <div class="chat-header">
    <div class="back">‹</div>
    <div class="avatar">PT</div>
    <div class="info">
      <div class="name">P-Chat · PdTT</div>
      <div class="status">carga de avance</div>
    </div>
    <div class="proto-pill">Proto</div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-bar hidden" id="inputBar">
    <div class="input-pill">
      <input type="text" id="numInput" inputmode="numeric" pattern="[0-9]*" placeholder="Escribí un número…">
    </div>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>

</div>

<script>
// ---- Datos de ejemplo (mismo set del proto v0.1) ----
const DATA = [
  {capataz:"Capataz Cañeria A", iwp:111, nombre:"M1 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Cañeria B", iwp:112, nombre:"M2 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Cañeria A", iwp:113, nombre:"M3 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Cañeria B", iwp:114, nombre:"M4 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Cañeria A", iwp:115, nombre:"M5 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Cañeria B", iwp:116, nombre:"M6 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Cañeria A", iwp:117, nombre:"M7 - Soldaduras", tipo:"Cañeria"},
  {capataz:"Capataz Mecanica", iwp:121, nombre:"M1 - Montaje 1", tipo:"Mecanica"},
  {capataz:"Capataz Mecanica", iwp:122, nombre:"M2 - Montaje 2", tipo:"Mecanica"},
  {capataz:"Capatas Electricidad", iwp:131, nombre:"M1 - Ele 1", tipo:"Electricidad"},
  {capataz:"Capatas Electricidad", iwp:132, nombre:"M2 - Ele 2", tipo:"Electricidad"},
];

const capataces = [...new Set(DATA.map(d => d.capataz))];

const messagesEl = document.getElementById('messages');
const inputBar = document.getElementById('inputBar');
const numInput = document.getElementById('numInput');
const sendBtn = document.getElementById('sendBtn');

let state = 'ask_capataz';
let ctx = { capataz:null, iwp:null, cantidad:null, personas:null };

function now(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function scrollBottom(){
  // Doble rAF: espera a que el navegador termine el layout (burbujas largas,
  // tarjeta de resumen, botones) antes de medir scrollHeight real.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  });
}

function addBotBubble(text, {error=false}={}){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  const bub = document.createElement('div');
  bub.className = 'bubble' + (error ? ' error' : '');
  bub.innerHTML = `<div class="txt"></div><div class="meta">${now()}</div>`;
  bub.querySelector('.txt').textContent = text;
  row.appendChild(bub);
  messagesEl.appendChild(row);
  scrollBottom();
  return bub;
}

function addUserBubble(text){
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = `<div class="txt"></div><div class="meta">${now()} <span class="check">✓✓</span></div>`;
  bub.querySelector('.txt').textContent = text;
  row.appendChild(bub);
  messagesEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay=450){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  messagesEl.appendChild(row);
  scrollBottom();
  setTimeout(() => {
    row.remove();
    cb();
  }, delay);
}

function addQuickReplies(options){
  const wrap = document.createElement('div');
  wrap.className = 'qr-wrap';
  options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'qr-btn';
    btn.innerHTML = opt.sub
      ? `${opt.label}<span class="sub">${opt.sub}</span>`
      : opt.label;
    btn.addEventListener('click', () => opt.onClick());
    wrap.appendChild(btn);
  });
  messagesEl.appendChild(wrap);
  scrollBottom();
}

function setInputMode(active, placeholder=''){
  if(active){
    inputBar.classList.remove('hidden');
    numInput.value = '';
    numInput.placeholder = placeholder;
    sendBtn.removeAttribute('disabled');
    setTimeout(() => numInput.focus(), 50);
  } else {
    inputBar.classList.add('hidden');
  }
}

// ---- Flujo ----
function startFlow(){
  ctx = { capataz:null, iwp:null, cantidad:null, personas:null };
  state = 'ask_capataz';
  setInputMode(false);
  showTyping(() => {
    addBotBubble('¡Hola! 👋 ¿Quién sos?');
    addQuickReplies(capataces.map(c => ({
      label: c,
      onClick: () => selectCapataz(c)
    })));
  }, 300);
}

function selectCapataz(c){
  addUserBubble(c);
  ctx.capataz = c;
  state = 'ask_iwp';
  showTyping(() => {
    addBotBubble(`Dale. ¿Qué actividad cargás?`);
    const items = DATA.filter(d => d.capataz === c);
    addQuickReplies(items.map(it => ({
      label: it.nombre,
      sub: `IWP ${it.iwp} · ${it.tipo}`,
      onClick: () => selectIWP(it)
    })));
  });
}

function selectIWP(item){
  addUserBubble(`IWP ${item.iwp} — ${item.nombre}`);
  ctx.iwp = item;
  state = 'ask_cantidad';
  showTyping(() => {
    addBotBubble('¿Cantidad de trabajo realizado?');
    setInputMode(true, 'Ej: 40');
  });
}

function handleCantidad(raw){
  const n = Number(raw);
  if(raw.trim() === '' || isNaN(n) || n <= 0){
    addUserBubble(raw || '(vacío)');
    setInputMode(false);
    showTyping(() => {
      addBotBubble('Ese valor no es válido. Ingresá un número mayor a cero.', {error:true});
      setInputMode(true, 'Ej: 40');
    }, 350);
    return;
  }
  addUserBubble(raw);
  ctx.cantidad = n;
  state = 'ask_personas';
  setInputMode(false);
  showTyping(() => {
    addBotBubble('¿Cantidad de personas en la cuadrilla?');
    setInputMode(true, 'Ej: 3');
  });
}

function handlePersonas(raw){
  const n = Number(raw);
  if(raw.trim() === '' || isNaN(n) || n <= 0){
    addUserBubble(raw || '(vacío)');
    setInputMode(false);
    showTyping(() => {
      addBotBubble('Ese valor no es válido. Ingresá un número mayor a cero.', {error:true});
      setInputMode(true, 'Ej: 3');
    }, 350);
    return;
  }
  addUserBubble(raw);
  ctx.personas = n;
  const hh = n * 8;
  state = 'confirm';
  setInputMode(false);
  showTyping(() => showResumen(hh));
}

function showResumen(hh){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.style.maxWidth = '85%';
  bub.innerHTML = `
    <div class="txt">Este es el resumen:</div>
    <div class="resumen-box">
      <div class="row"><span>Capataz</span><b>${ctx.capataz}</b></div>
      <div class="row"><span>IWP</span><b>${ctx.iwp.iwp} — ${ctx.iwp.nombre}</b></div>
      <div class="row"><span>Cantidad</span><b>${ctx.cantidad}</b></div>
      <div class="row"><span>Personas</span><b>${ctx.personas}</b></div>
      <div class="row"><span>HH (personas × 8)</span><b>${hh}</b></div>
      <div class="resumen-actions">
        <button class="btn-nuevo">Nuevo</button>
        <button class="btn-enviar">Enviar</button>
      </div>
    </div>
    <div class="meta">${now()}</div>
  `;
  bub.querySelector('.btn-enviar').addEventListener('click', () => confirmarEnvio(hh));
  bub.querySelector('.btn-nuevo').addEventListener('click', () => cancelarYNuevo());
  row.appendChild(bub);
  messagesEl.appendChild(row);
  scrollBottom();
}

function confirmarEnvio(hh){
  addUserBubble('Enviar ✔');
  showTyping(() => {
    addBotBubble(`✅ Carga guardada — IWP ${ctx.iwp.iwp}, Cant. ${ctx.cantidad}, HH ${hh}.`);
    setTimeout(startFlow, 1400);
  }, 350);
}

function cancelarYNuevo(){
  addUserBubble('Nuevo');
  showTyping(() => {
    addBotBubble('Sin problema, empecemos de nuevo.');
    setTimeout(startFlow, 900);
  }, 300);
}

sendBtn.addEventListener('click', () => {
  const val = numInput.value;
  numInput.value = '';
  if(state === 'ask_cantidad') handleCantidad(val);
  else if(state === 'ask_personas') handlePersonas(val);
});
numInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') sendBtn.click();
});

// Arranque
startFlow();
</script>
</body>
</html>
